services:
  nginx:
    restart: always

  backend:
    restart: always
    build:
      context: ./backend
    # 3 процесса × 4 потока — с запасом на 300+ одновременных пользователей на сервере с 2 ядрами.
    # Число процессов можно поменять переменной GUNICORN_WORKERS в .env.
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --workers ${GUNICORN_WORKERS:-3} --threads 4 --keep-alive 120 -b 0.0.0.0:8000 --max-requests 10000 --max-requests-jitter 1000 --access-logfile - --error-logfile -"
    environment:
      - DEBUG=False
    depends_on:
      - db
      - redis
