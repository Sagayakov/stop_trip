# Общая конфигурация. Локально к ней автоматически добавляется docker-compose.override.yml,
# на сервере — docker-compose.production.yml (через флаг -f).

x-app_environment: &app_environment
  environment:
    - DEBUG
    - SECRET_KEY
    - POSTGRES_PASSWORD
    - POSTGRES_HOST
    - POSTGRES_PORT
    - POSTGRES_NAME
    - POSTGRES_USER
    - SITE_HOST
    - YND_ACCESS_KEY_ID
    - YND_SECRET_ACCESS_KEY
    - YND_STORAGE_BUCKET_NAME
    - EMAIL_HOST_USER
    - EMAIL_HOST_PASSWORD
    - ALLOWED_HOSTS
    - CORS_ALLOWED_ORIGINS
    - GOOGLE_OAUTH2_KEY
    - GOOGLE_OAUTH2_SECRET
    - MEDIA_URL
    - REDIS_CACHE_URL
    - THROTTLE_CONTACTS_ANON
    - THROTTLE_CONTACTS_USER

services:
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend/:/app/:cached
    restart: unless-stopped
    command: sh -c "python3 manage.py migrate && python3 manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db
      - redis
    # Порт 8000 наружу открывается только локально — см. docker-compose.override.yml.
    # На сервере бэкенд доступен только через nginx.
    <<: *app_environment

  db:
    build:
      context: ./db
    volumes:
      - postgresdata:/var/lib/postgresql/data
    # Пароль берётся из .env. Порт базы наружу открывается только локально (override).
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_NAME:-postgres}
    restart: unless-stopped

  # Кэш и сессии
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  nginx:
    volumes:
      - nginx_cache:/var/lib/nginx/proxy_cache
      - static:/var/www/static/:ro
      # Фото объявлений (когда файлы хранятся на диске сервера, а не в облаке)
      - ./backend/media:/var/www/media/:ro
      - acme.sh:/acme.sh:delegated
      - certs:/etc/nginx/certs
    build:
      context: ./nginx
    depends_on:
      - backend
    ports:
      - 80:80
      - 443:443
    restart: unless-stopped
    environment:
      - TLS_MODE
      - HTPASSWD_NODE
      - HTPASSWD

volumes:
  postgresdata:
  nginx_cache:
  static:
  acme.sh:
  certs:
  redisdata:
